<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Sign in to Ronyx Fitness</title>
<!--
  The code email's Sign in button lands here (Gmail and other mail apps
  won't open ronyxfitness:// links themselves). The code and email are
  in the part after #, which the browser never sends to any server, so
  they aren't in GitHub's logs. This page hands them to the app.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #191716; background-image: linear-gradient(135deg, #221C17 0%, #191716 55%, #17161B 100%);
    color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin: 0 8px 18px; }
  .pane {
    padding: 32px 26px; border-radius: 32px; border: 1px solid #57504A;
    background: linear-gradient(135deg, #3A3028 0%, #2A2420 100%);
    box-shadow: 8px 12px 32px rgba(0,0,0,0.55);
  }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; margin: 0; }
  p { color: #D2CDC8; font-size: 15.5px; line-height: 1.5; margin: 10px 0 0; }
  .button {
    display: block; width: 100%; margin-top: 26px; padding: 17px 12px; border: 0; border-radius: 999px;
    background: #fff; color: #0F0E0D; font-size: 16px; font-weight: 600; text-align: center; text-decoration: none;
  }
  .hint { color: #A39D98; font-size: 13.5px; text-align: center; margin-top: 18px; }
  .code {
    margin-top: 12px; padding: 18px 12px; border-radius: 999px; border: 1px solid #5C554F; background: #3A332E;
    font-size: 34px; font-weight: 600; letter-spacing: 8px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .copy {
    display: block; width: 100%; margin-top: 12px; padding: 14px 12px; border-radius: 999px;
    border: 1px solid #57504A; background: rgba(255,255,255,0.06); color: #fff; font-size: 15px; font-weight: 600;
  }
  .small { color: #A39D98; font-size: 13px; line-height: 1.5; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Ronyx Fitness</div>
  <div class="pane">
    <h1 id="title">Opening the app…</h1>
    <p id="lead">If nothing happens, tap the button. It needs to be on the phone with Ronyx Fitness.</p>
    <a id="open" class="button" href="#">Sign in to Ronyx Fitness</a>
    <div id="manual">
      <div class="hint">Or type this code in the app:</div>
      <div id="code" class="code">–</div>
      <button id="copy" class="copy" type="button">Copy code</button>
    </div>
    <p class="small">The code expires in an hour and works once.</p>
  </div>
</div>
<script>
  (function () {
    // Read by hand: URLSearchParams would turn a "+" in an email into a space.
    var params = {};
    location.hash.slice(1).split("&").forEach(function (pair) {
      var i = pair.indexOf("=");
      if (i > 0) {
        try { params[pair.slice(0, i)] = decodeURIComponent(pair.slice(i + 1)); } catch (e) {}
      }
    });
    var code = (params.code || "").replace(/\D/g, "");
    var email = (params.email || "").trim();
    var title = document.getElementById("title");
    var open = document.getElementById("open");
    if (code.length < 6 || email.indexOf("@") < 0) {
      title.textContent = "This link is incomplete";
      document.getElementById("lead").textContent = "Open the email again and tap the button, or type the code from the email in the app.";
      open.style.display = "none";
      document.getElementById("manual").style.display = "none";
      return;
    }
    var appLink = "ronyxfitness://code/" + code + "?email=" + encodeURIComponent(email);
    open.href = appLink;
    document.getElementById("code").textContent = code;
    document.getElementById("copy").addEventListener("click", function () {
      var button = this;
      navigator.clipboard.writeText(code).then(function () {
        button.textContent = "Copied";
      }, function () {
        button.textContent = "Couldn't copy, type it in";
      });
    });
    // Straight on to the app; some in-app browsers need the tap instead.
    location.href = appLink;
    setTimeout(function () { title.textContent = "Sign in to Ronyx Fitness"; }, 1500);
  })();
</script>
</body>
</html>
